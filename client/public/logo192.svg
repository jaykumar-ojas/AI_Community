<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <!-- Elegant gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main text with elegant typography -->
  <text x="200" y="60" font-family="Georgia, serif" font-size="42" font-weight="300" text-anchor="middle" fill="url(#textGradient)" letter-spacing="2px">
    pixxelmind
  </text>
  
  <!-- Subtle decorative elements -->
  <line x1="80" y1="70" x2="120" y2="70" stroke="#333333" stroke-width="1" opacity="0.6"/>
  <line x1="280" y1="70" x2="320" y2="70" stroke="#333333" stroke-width="1" opacity="0.6"/>
  
  <!-- Minimalist dots -->
  <circle cx="85" cy="70" r="1.5" fill="#666666" opacity="0.8"/>
  <circle cx="95" cy="70" r="1" fill="#666666" opacity="0.6"/>
  <circle cx="105" cy="70" r="1.5" fill="#666666" opacity="0.8"/>
  <circle cx="115" cy="70" r="1" fill="#666666" opacity="0.6"/>
  
  <circle cx="285" cy="70" r="1" fill="#666666" opacity="0.6"/>
  <circle cx="295" cy="70" r="1.5" fill="#666666" opacity="0.8"/>
  <circle cx="305" cy="70" r="1" fill="#666666" opacity="0.6"/>
  <circle cx="315" cy="70" r="1.5" fill="#666666" opacity="0.8"/>
  
  <!-- Subtle pixel-inspired accent -->
  <g opacity="0.3">
    <rect x="160" y="40" width="2" height="2" fill="#333333"/>
    <rect x="164" y="42" width="1" height="1" fill="#333333"/>
    <rect x="237" y="42" width="1" height="1" fill="#333333"/>
    <rect x="240" y="40" width="2" height="2" fill="#333333"/>
  </g>
</svg>